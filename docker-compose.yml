# Kotlin backend + original Next.js frontend.
# Usage: docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: allocator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allocator"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend-kotlin
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/allocator
      CSV_ROOT_PATH: /data/csv
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALLOCATOR_LLM_PROVIDER: ${ALLOCATOR_LLM_PROVIDER:-}
      ASSESSMENT_MODEL: ${ASSESSMENT_MODEL:-}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
      NANOGPT_BASE_URL: ${NANOGPT_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
    volumes:
      - ./csv:/data/csv:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      API_BACKEND_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    depends_on:
      - backend

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: securepassword
    ports:
      - "10000:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin/
    depends_on:
      - db

volumes:
  pgdata:
  frontend_node_modules:
  pgadmin-data:
